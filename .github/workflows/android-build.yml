name: Android build and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Build APKs and run Kotlin tests and lint
        run: >-
          bash gradlew --no-daemon
          -PreleaseVersionCode="$((GITHUB_RUN_NUMBER + 1))"
          -PreleaseVersionName="1.0.${GITHUB_RUN_NUMBER}"
          :core:test
          :core:synthetic
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          :app:assembleDebugAndroidTest
          :app:lintDebug

      - name: Test reference decoder and synthetic export
        run: |
          python3 -m unittest discover -s tools -p 'test_decoder.py' -v
          python3 tools/decode.py deliverables/campus-recordings-v1.zip

      - name: Sign the release APK with the fixed repository key
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p release
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks .github/signing/campus-recorder.p12 \
            --ks-key-alias campusrecorder \
            --ks-pass pass:campusrecorder \
            --key-pass pass:campusrecorder \
            --out release/CampusRecorder.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/CampusRecorder.apk
          cd release
          sha256sum CampusRecorder.apk > SHA256SUMS.txt

      - name: Upload APKs, example recording, and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: campus-recorder-build-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/test-results/testDebugUnitTest/*.xml
            core/build/test-results/test/*.xml
            core/build/reports/tests/test/index.html
            deliverables/campus-recordings-v1.zip
            deliverables/synthetic-benchmark.json
            release/CampusRecorder.apk
            release/SHA256SUMS.txt

  release:
    name: Publish signed APK to GitHub Releases
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the signed build
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --name "campus-recorder-build-${GITHUB_RUN_NUMBER}"
          --dir artifacts

      - name: Publish a release for this commit
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" \
              artifacts/release/CampusRecorder.apk \
              artifacts/release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$tag" \
              artifacts/release/CampusRecorder.apk \
              artifacts/release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Campus Recorder 1.0.${GITHUB_RUN_NUMBER}" \
              --notes "Download CampusRecorder.apk to install or update. Built from commit $GITHUB_SHA using the fixed repository signing key." \
              --generate-notes
          fi
